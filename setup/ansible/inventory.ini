# Ansible inventory for HammerDB benchmark runner VMs.
# Mirrors hosts.txt — one host per line, grouped under [runners].
#
# Override per-host settings inline, e.g.:
#   10.0.0.3  ansible_user=benchuser  ansible_port=2222
#
# To use your existing hosts.txt directly instead of this file, run:
#   ansible-playbook -i ../hosts.txt runner_setup.yml
#   (Ansible accepts a bare host-per-line file as a valid inventory)

[runners]
citus-runner-m1
citus-runner-m2
citus-runner-m3
citus-runner-m4

[runners:vars]
# SSH login user for runner VMs
ansible_user=azureuser
