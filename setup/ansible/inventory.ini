# Ansible inventory template for HammerDB benchmark runner VMs.
# Copy this file to inventory.local.ini and edit that local copy.
#
# Override per-host settings inline, e.g.:
#   runner-1 ansible_host=192.0.2.10 ansible_user=benchuser ansible_port=2222
#
# To use your existing hosts.txt directly instead of this file, run:
#   ansible-playbook -i ../hosts.txt runner_setup.yml
#   (Ansible accepts a bare host-per-line file as a valid inventory)

[runners]
# runner-1 ansible_host=192.0.2.10
# runner-2 ansible_host=192.0.2.11
hamid-citus-hammerdb-test-runner

[runners:vars]
# SSH login user for runner VMs
ansible_user=azureuser
# Avoid interactive host key prompt on first connect.
# Keys are still verified on subsequent connections.
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
