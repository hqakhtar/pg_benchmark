# Variables for runner_setup.yml
# Edit these to match your environment before running the playbook.

# ── PostgreSQL ────────────────────────────────────────────────────────────────
pg_version: "17"

# ── Remote user ───────────────────────────────────────────────────────────────
# SSH defaults for provisioning; override in vars.local.yml if needed.
ansible_user: azureuser
ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new"

# Home directory on the runner VMs (tasks that write dotfiles use this).
runner_user: "{{ ansible_user }}"
runner_home: "/home/{{ runner_user }}"

# ── pg_benchmark repo ────────────────────────────────────────────────────────
# Upload the pg_benchmark checkout from this control machine instead of cloning
# from GitHub. pg_benchmark_local_path points at the local repo root.
pg_benchmark_local_path: "{{ playbook_dir }}/../.."
pg_benchmark_dest: "{{ runner_home }}/pg_benchmark"

# Set true to mirror deletions (rsync --delete) so the remote matches the local
# folder exactly. Set false to only add/update files without removing extras.
update_pg_benchmark: true

# Private configuration is excluded from repository synchronization.
update_benchmark_config: false
benchmark_config_local_dir: "{{ playbook_dir }}/../.."
benchmark_config_files:
  - connection.env
  - hammerdb/hammerdb.env
  - run.env

# ── HammerDB tarball ─────────────────────────────────────────────────────────
# Install when the requested version is absent. A complete existing installation
# is left untouched and needs no local archive. Set false to skip installation.
install_hammerdb: true
# Only this explicit opt-in allows an existing installation to be replaced.
reinstall_hammerdb: false
# Match this to the archive's top-level directory. A custom tarball path does
# not infer the version; mismatched contents fail preflight when installing.
hammerdb_version: "5.0"
hammerdb_dir_name: "HammerDB-{{ hammerdb_version }}"
hammerdb_archive_name: "{{ hammerdb_dir_name }}-Prod-Linux.tar.gz"
local_hammerdb_tarball: "{{ playbook_dir }}/{{ hammerdb_archive_name }}"
hammerdb_dest: "{{ runner_home }}"
