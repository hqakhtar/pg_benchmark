# Variables for runner_setup.yml
# Edit these to match your environment before running the playbook.

# ── PostgreSQL ────────────────────────────────────────────────────────────────
pg_version: "17"

# ── Remote user ───────────────────────────────────────────────────────────────
# Home directory on the runner VMs (tasks that write dotfiles use this).
runner_user: "{{ ansible_user }}"
runner_home: "/home/{{ runner_user }}"

# ── pg_benchmark repo ────────────────────────────────────────────────────────
# Upload the pg_benchmark checkout from this control machine instead of cloning
# from GitHub. pg_benchmark_local_path points at the local repo root.
pg_benchmark_local_path: "{{ playbook_dir }}/../.."
pg_benchmark_dest: "{{ runner_home }}/pg_benchmark"

# Set true to mirror deletions (rsync --delete) so the remote matches the local
# folder exactly. Set false to only add/update files without removing extras.
update_pg_benchmark: true

# Set true after creating myenv.sh from myenv.sh.sample in the repository root.
update_myenv: false
myenv_local_path: "{{ playbook_dir }}/../../myenv.sh"
myenv_remote_path: "{{ pg_benchmark_dest }}/myenv.sh"

# ── HammerDB tarball (optional) ───────────────────────────────────────────────
# Set install_hammerdb: true and place the built tarball at the path below to
# have Ansible copy and extract it on every runner.
# Leave install_hammerdb: false to skip.
install_hammerdb: false
# HammerDB version drives both the tarball name and the extracted directory
# name, so they can never drift out of sync.
hammerdb_version: "5.0"
hammerdb_dir_name: "HammerDB-{{ hammerdb_version }}"
hammerdb_archive_name: "{{ hammerdb_dir_name }}-Prod-Linux.tar.gz"
local_hammerdb_tarball: "{{ playbook_dir }}/{{ hammerdb_archive_name }}"
hammerdb_dest: "{{ runner_home }}"
