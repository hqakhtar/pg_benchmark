name: Environment file policy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  env-policy:
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test the environment-file guard
        run: bash tests/test_env_policy.sh

      - name: Check committed files and new commit history
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          base="${BASE_SHA:-0}"
          if [[ "$base" =~ ^0+$ && "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]
          then
              default_ref="refs/remotes/origin/$DEFAULT_BRANCH"
              if git show-ref --verify --quiet "$default_ref"
              then
                  base="$(git rev-parse --verify "$default_ref")"
              fi

          fi

          bash setup/check_env_files.sh --range "$base" HEAD
